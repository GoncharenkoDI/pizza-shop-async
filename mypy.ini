[mypy]
python_version = 3.14
show_error_codes = True

# Не падати на бібліотеки, які не мають анотації типів (наприклад, старі або рідкісні пакети)
ignore_missing_imports = True

# Перевіряти тільки ті функції, де є хоча б одна інструкція
check_untyped_defs = False

# Дозволити динамічне приведення типів без зайвих зауважень
allow_redefinition = True
